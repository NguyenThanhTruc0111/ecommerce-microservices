name: ecommerce-microservices

services:
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      PGHOST: auth-postgres
      PGPORT: 5432
      PGUSER: auth_user
      PGPASSWORD: auth_dev_password
      PGDATABASE: auth_db
      JWT_SECRET: local-practice-auth-secret-change-before-deploy-2026
      GRPC_ADDRESS: "0.0.0.0:50051"
    depends_on:
      auth-postgres:
        condition: service_healthy
  product-mongo:
    image: mongo:7
    volumes:
      - product-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  shipment-mongo:
    image: mongo:7
    volumes:
      - shipment-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  auth-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_dev_password
      POSTGRES_DB: auth_db
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  customer-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: customer_dev_password
      POSTGRES_DB: customer_db
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - customer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_user -d customer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_dev_password
      POSTGRES_DB: order_db
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  auth-postgres-data:
  customer-postgres-data:
  order-postgres-data:
  kafka-data:
  product-mongo-data:
  shipment-mongo-data:
  redis-data: